[book]
title = "The Framebuffer Course"
authors = ["Samir Arioui"]
description = "From C foundations to a finished 2D arcade game on an engine you wrote yourself."
language = "en"
src = "book"

[build]
# Static site output. Self-contained; deploys to any static host
# (GitHub Pages is the assumed deployment target). Never published from plan/.
build-dir = "site"
# Every chapter file is authored explicitly; mdBook must not invent files.
create-missing = false
