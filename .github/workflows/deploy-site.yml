# Builds both editions of the course site with the pinned mdBook and deploys
# them to GitHub Pages: the English edition from book/ to site/, then the
# French edition from book-fr/ to site/fr/. The pin (mdBook 0.5.4) lives here
# and in README.md; keep the two in step. plan/, src/, and openspec/ never
# appear in published output (build-dir is site/ for the English book and
# site/fr/ for the French one).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a publish in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the translation checker reads git log to assess
          # drift, and a shallow clone truncates the history it needs.
          fetch-depth: 0

      - name: Install pinned mdBook 0.5.4
        run: |
          curl -sL -o /tmp/mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/mdbook.tar.gz -C /tmp
          install -m 755 /tmp/mdbook /usr/local/bin/mdbook
          mdbook --version | grep -F 'mdbook v0.5.4'

      - name: Build the English site
        run: mdbook build

      # The translation-fidelity checker gates the deploy: a French page whose
      # code, marker, or drift is off stops the publication (design D6/D8).
      - name: Check the French edition against its English sources
        run: ./tools/check-fr-sync.sh

      # English first, French second: mdbook build clears its build directory,
      # and the French edition publishes inside the English one (design D2).
      - name: Build the French site
        run: mdbook build book-fr

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
